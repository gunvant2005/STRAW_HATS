<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    
    <!-- SEO & Metadata -->
    <title>Product Intelligence | Industrial Commerce</title>
    <meta
      name="description"
      content="AI-Powered Product Intelligence for Industrial Commerce. Convert fragmented product data into structured, evidence-linked, commerce-ready records."
    />
    <meta name="keywords" content="product intelligence, industrial commerce, SKU enrichment, PIM, AI cataloging, industrial manufacturing" />
    <meta name="author" content="Industrial Commerce AI" />
    <link rel="canonical" href="https://product-intelligence.industrial/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://product-intelligence.industrial/" />
    <meta property="og:title" content="Product Intelligence | Industrial Commerce" />
    <meta property="og:description" content="Convert fragmented product inputs into structured, evidence-linked, commerce-ready product records." />
    <meta property="og:image" content="https://product-intelligence.industrial/og-cover.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Product Intelligence | Industrial Commerce" />
    <meta name="twitter:description" content="AI-Powered Product Intelligence for Industrial Commerce." />
    <meta name="twitter:image" content="https://product-intelligence.industrial/og-cover.png" />

    <!-- Security & Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:5000 https://www.google-analytics.com;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Fonts — preconnect + preload critical weights -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Product Intelligence",
        "operatingSystem": "Web Browser",
        "applicationCategory": "BusinessApplication",
        "description": "AI-powered product intelligence platform for industrial commerce.",
        "offers": {
          "@type": "Offer",
          "price": "0"
        }
      }
